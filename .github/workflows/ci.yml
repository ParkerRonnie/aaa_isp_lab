name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 图表里的中文标签需要 CJK 字体，否则渲染成方块（不报错，但图不可读）
      - name: 安装中文字体
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # C++ 统计库是可选组件，但**在 CI 里必须编出来** —— 否则测试是条件注册的，
      # 会静默变少却仍然全绿。这是防「假绿」的唯一护栏。
      - name: 编译 C++ 统计库
        run: |
          python tools/build_native.py --print-cmd
          python tools/build_native.py --with-bench

      - name: 断言共享库可加载（硬 gate）
        run: python tools/build_native.py --check

      - name: C++ 独立自检（不经过 Python）
        run: ./native/build/aaa_native --self-test

      - name: 单元测试
        run: pytest -v

      - name: 端到端冒烟（快速模式，确认能出报告）
        run: aaa-isp-lab --fast --out /tmp/ci_out

      - name: 确认产物齐全
        run: |
          test -f /tmp/ci_out/report.html
          test -f /tmp/ci_out/report.md
          test -f /tmp/ci_out/results.json
          ls /tmp/ci_out | wc -l
