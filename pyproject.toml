[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aaa-isp-lab"
version = "0.3.0"
description = "3A（AE/AWB/AF）算法与 ISP 画质调优实验平台：从物理建模到量化评价的完整仿真链路"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ParkerRonnie" }]
keywords = [
    "isp", "camera", "auto-exposure", "auto-white-balance", "autofocus",
    "3a", "image-quality", "computational-photography", "image-processing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aaa-isp-lab = "aaa_isp_lab.cli:main"

[project.urls]
Repository = "https://github.com/ParkerRonnie/aaa_isp_lab"

[tool.setuptools.packages.find]
where = ["src"]

# C++ 共享库是**可选**组件（python tools/build_native.py 现场编译，不进 git）。
# 这一行是为了让"已经编出来的库"在 pip 安装时被一起打包；库不存在也不报错。
[tool.setuptools.package-data]
"aaa_isp_lab.native" = ["*.dll", "*.so", "*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # 行长由 formatter 负责
    "B008",   # dataclass 默认值里的函数调用是本项目刻意的写法
    "UP006", "UP007",  # 保持 typing.Tuple 写法，兼容 3.9
]
